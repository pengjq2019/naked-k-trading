name: 黄金裸K线4小时价格行为微信推送

on:
  schedule:
    # 对应北京时间 02:05, 06:05, 10:05, 14:05, 18:05, 22:05 (4H收线后5分钟)
    - cron: '5 2,6,10,14,18,22 * * *'
  workflow_dispatch: # 支持在 GitHub 页面一键手动触发测试

jobs:
  analyze_and_push:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置 Python 运行环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 执行裸K双向研判并推送微信
        env:
          TZ: 'Asia/Shanghai'
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          WXPUSHER_APP_TOKEN: ${{ secrets.WXPUSHER_APP_TOKEN }}
          WXPUSHER_UID: ${{ secrets.WXPUSHER_UID }}
        run: |
          python scripts/analyze_gold.py
