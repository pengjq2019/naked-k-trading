name: 黄金裸K线4小时价格行为微信推送

on:
  schedule:
    # 冬令时标准 (每年11月第一个周日至次年3月第二个周日):
    # 黄金 4H 收线时间 (北京时间): 03:00, 07:00, 11:00, 15:00, 19:00, 23:00
    # 收线后第8分钟触发 (北京时间 03:08, 07:08, 11:08, 15:08, 19:08, 23:08)
    # 对应 UTC 时间: 19:08, 23:08, 03:08, 07:08, 11:08, 15:08
    # 注: 夏令时期间需调整为: '8 2,6,10,14,18,22 * * *' (对应北京时间 02:08, 06:08, 10:08, 14:08, 18:08, 22:08)
    - cron: '8 3,7,11,15,19,23 * * *'
  workflow_dispatch: # 支持网页一键运行与 workflow_dispatch API 触发
  repository_dispatch: # 支持外部精准定时心跳 (如 cron-job.org) 瞬时唤醒
    types: [gold_alert]

jobs:
  analyze_and_push:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置 Python 运行环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 执行裸K双向研判并推送微信
        env:
          TZ: 'Asia/Shanghai'
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          WXPUSHER_APP_TOKEN: ${{ secrets.WXPUSHER_APP_TOKEN }}
          WXPUSHER_UID: ${{ secrets.WXPUSHER_UID }}
        run: |
          python scripts/analyze_gold.py
